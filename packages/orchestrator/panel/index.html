<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>modes console</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #f6f8fa;
    --term-bg: #f6f8fa;
    --border: #d1d9e0;
    --fg: #1f2328;
    --muted: #59636e;
    --accent: #0969da;
    --accent-soft: rgba(9, 105, 218, 0.12);
    --on-accent: #ffffff;
    --danger: #d1242f;
    --danger-soft: rgba(209, 36, 47, 0.08);
    --success: #1a7f37;
    --warn: #9a6700;
    --add-fg: #1a7f37;
    --add-bg: rgba(26, 127, 55, 0.12);
    --del-fg: #d1242f;
    --del-bg: rgba(209, 36, 47, 0.1);
    --ask-bg: #ffffff;
    --ask-shadow: 0 1px 2px rgba(27, 31, 36, 0.05), 0 8px 24px rgba(27, 31, 36, 0.06);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --term-bg: #0d1117;
      --border: #21262d;
      --fg: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --accent-soft: rgba(47, 129, 247, 0.16);
      --on-accent: #ffffff;
      --danger: #f85149;
      --danger-soft: rgba(248, 81, 73, 0.12);
      --success: #3fb950;
      --warn: #d29922;
      --add-fg: #3fb950;
      --add-bg: rgba(63, 185, 80, 0.15);
      --del-fg: #f85149;
      --del-bg: rgba(248, 81, 73, 0.15);
      --ask-bg: #161b22;
      --ask-shadow: 0 1px 2px rgba(1, 4, 9, 0.4);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-size: 14px;
    line-height: 1.5;
  }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); font-size: 13px; }

  /* --- frame: sidebar + stage ------------------------------------------- */
  #app { display: grid; grid-template-columns: 272px 1fr; min-height: 100vh; }
  aside {
    border-right: 1px solid var(--border);
    background: var(--surface);
    padding: 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow-y: auto;
    max-height: 100vh;
    position: sticky;
    top: 0;
  }
  .brand { padding: 0 8px; display: flex; align-items: baseline; gap: 8px; }
  .brand .wordmark { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .brand .tag { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }

  #new-task-btn {
    margin: 0 4px;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
  }
  #new-task-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* --- task history, grouped by status ----------------------------------- */
  .task-list { display: flex; flex-direction: column; gap: 2px; }
  .tl-group-head {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 10px 8px 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .tl-group-head .count { font-weight: 400; }
  .tl-empty { padding: 8px; color: var(--muted); font-size: 12px; }
  .task-item {
    padding: 7px 8px;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .task-item:hover { background: var(--bg); }
  .task-item.selected { background: var(--bg); border-color: var(--border); }
  .task-item .ti-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .task-item .repo-badge {
    flex: none;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 5px;
    line-height: 16px;
    max-width: 88px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .task-item .prompt {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
  }
  .task-item .meta { display: flex; gap: 8px; align-items: center; margin-top: 2px; }
  .task-item .ti-mode { font-size: 11px; color: var(--muted); }
  .task-item .ti-mode .auto-mark { color: var(--accent); }
  .task-item .ti-time { font-size: 11px; color: var(--muted); margin-left: auto; }
  .task-item .ti-clean {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 11px;
    padding: 0 2px;
    cursor: pointer;
    border-radius: 4px;
    display: none;
  }
  .task-item:hover .ti-clean { display: inline; }
  .task-item .ti-clean:hover { color: var(--danger); }

  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.st-running { background: var(--accent); animation: breathe 1.6s ease-in-out infinite; }
  .dot.st-done { background: var(--success); }
  .dot.st-failed { background: var(--danger); }
  .dot.st-awaiting_pick { background: var(--warn); }
  @keyframes breathe {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 var(--accent-soft); }
    50% { opacity: 0.5; box-shadow: 0 0 0 5px var(--accent-soft); }
  }

  /* --- stage ------------------------------------------------------------- */
  main { min-width: 0; }
  section#detail[hidden], #stage-empty[hidden] { display: none; }

  /* task view top bar — Orca-style thin strip above the activity */
  .task-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .task-bar .tb-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 600;
  }
  .task-body { padding: 24px 32px 64px; max-width: 1080px; }
  .task-body .meta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 4px; }

  /* empty state: consumer-grade entry — greeting, ask card, team pills */
  #stage-empty { display: flex; justify-content: center; padding: 12vh 32px 64px; }
  .empty-inner { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 20px; }
  .empty-title {
    margin: 0 0 4px;
    text-align: center;
    font-size: 28px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }

  /* mode picker demoted to a quiet text link row above the card */
  .mode-links { text-align: center; font-size: 12px; color: var(--muted); }
  .mode-links button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    padding: 2px 3px;
    cursor: pointer;
  }
  .mode-links button:hover { color: var(--fg); }
  .mode-links button.active { color: var(--accent); font-weight: 600; }
  .mode-links .sep { opacity: 0.5; }

  /* team roster: one row of rounded pills, none lit = dispatcher's pick */
  .roster { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
  .roster .roster-label { font-size: 12px; color: var(--muted); margin-right: 2px; }
  .cli-chips { display: contents; }
  .cli-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--ask-bg);
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .cli-chip:hover { border-color: var(--accent); }
  .cli-chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); font-weight: 500; }
  .cli-chip:disabled { opacity: 0.45; cursor: default; }
  .cli-chip:disabled:hover { border-color: var(--border); }
  .chip-dot { width: 7px; height: 7px; border-radius: 50%; }
  .chip-dot.ok { background: var(--success); }
  .chip-dot.off { background: var(--muted); opacity: 0.5; }

  form#run-form { display: flex; flex-direction: column; gap: 12px; margin: 4px 0 0; }

  /* the ask card: one soft rounded surface, accent ring on focus */
  .ask-card {
    background: var(--ask-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--ask-shadow);
    overflow: hidden;
  }
  .ask-card:focus-within {
    border-color: var(--accent);
    box-shadow: var(--ask-shadow), 0 0 0 1px var(--accent);
  }
  textarea#prompt {
    width: 100%;
    min-height: 64px;
    padding: 16px 18px 4px;
    border: 0;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 16px;
    line-height: 1.5;
    resize: vertical;
  }
  textarea#prompt:focus { outline: none; }
  textarea#prompt::placeholder { color: var(--muted); opacity: 0.8; }
  .ask-bar { display: flex; align-items: center; justify-content: flex-end; padding: 8px 12px 12px; }
  button.primary {
    width: 34px;
    height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    color: var(--on-accent);
    cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.1); }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  button.primary svg { display: block; }

  /* "在项目中工作" chip: collapsed by default, reveals the repo path input */
  .repo-wrap { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .repo-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--ask-bg);
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .repo-chip:hover { border-color: var(--accent); color: var(--fg); }
  .repo-chip.open { color: var(--fg); border-color: var(--accent); }
  .repo-chip svg { display: block; }
  .repo-row { width: 100%; }
  .repo-row[hidden] { display: none; }
  input#repo-path {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--ask-bg);
    color: var(--fg);
    font-family: var(--mono);
    font-size: 12px;
  }
  input#repo-path:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  input#repo-path::placeholder { color: var(--muted); font-family: inherit; }

  /* "试试这些指令" — clickable starter prompts */
  .suggestions { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; }
  .suggestions .sugg-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .suggestion {
    align-self: flex-start;
    border: 0;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 13px;
    padding: 5px 0;
    cursor: pointer;
    text-align: left;
  }
  .suggestion:hover { color: var(--accent); }

  /* --- badges ------------------------------------------------------------ */
  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 12px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: var(--surface);
    flex: none;
  }
  .badge.ok { color: var(--success); border-color: color-mix(in srgb, var(--success) 45%, transparent); }
  .badge.bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
  .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
  .badge.auto { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: transparent; }
  .badge.mode { color: var(--fg); }

  /* the dispatcher speaks: one narrator line, its source always visible */
  .banner {
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    background: var(--surface);
    padding: 12px 16px;
    margin: 16px 0;
  }
  .banner .banner-label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .banner .verdict { font-weight: 650; }
  .banner .source-tag {
    display: inline-block;
    margin-left: 8px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 11px;
    color: var(--muted);
  }
  .banner.classification .verdict { color: var(--accent); }

  .error-box {
    border: 1px solid color-mix(in srgb, var(--danger) 50%, transparent);
    border-radius: 6px;
    background: var(--danger-soft);
    color: var(--danger);
    padding: 12px 16px;
    margin: 16px 0;
    font-size: 13px;
  }

  .running-note { display: flex; align-items: center; gap: 10px; margin-top: 24px; color: var(--muted); font-family: var(--mono); font-size: 12px; }

  /* --- terminal panels: lanes read as an agent activity stream ------------ */
  .lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 16px; }
  .lanes.single { grid-template-columns: 1fr; }
  .term { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--term-bg); }
  .term-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 12px;
  }
  .term-head .term-name { font-weight: 600; color: var(--fg); }
  .term-body {
    padding: 12px;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .term-body.muted-body { color: var(--muted); }
  .term .diff { margin: 0 12px 12px; }

  /* cascade: horizontal chain of terminal steps */
  .chain { display: flex; align-items: stretch; overflow-x: auto; margin-top: 16px; padding-bottom: 4px; }
  .chain-step {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--term-bg);
    min-width: 168px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .chain-step .step-head {
    padding: 6px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
  }
  .chain-step .step-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  .chain-step .step-latency { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .chain-arrow { align-self: center; padding: 0 12px; color: var(--muted); flex: none; font-family: var(--mono); }

  .round-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0 0;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--muted);
  }
  .round-head::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .round-head:first-of-type { margin-top: 4px; }

  /* --- live lane output: the stream inside/below a terminal panel --------- */
  .live-wrap { position: relative; border-bottom: 1px solid var(--border); }
  .live-wrap[hidden] { display: none; }
  .term.live-panel { margin-top: 16px; }
  .term.live-panel[hidden] { display: none; }
  .term.live-panel .live-wrap { border-bottom: 0; }
  .live-out {
    max-height: 260px;
    overflow-y: auto;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--fg);
  }
  .back-bottom {
    position: absolute;
    right: 10px;
    bottom: 10px;
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface);
    color: var(--muted);
    font: inherit;
    font-size: 11px;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(1, 4, 9, 0.2);
  }
  .back-bottom:hover { color: var(--fg); border-color: var(--accent); }

  /* --- diff: GitHub-style file blocks with gutters and +/- counts --------- */
  .diff {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    background: var(--term-bg);
    font-family: var(--mono);
    font-size: 12px;
  }
  .diff + .diff { margin-top: 12px; }
  .diff-file { border-top: 1px solid var(--border); }
  .diff-file:first-child { border-top: 0; }
  .diff-file-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--surface);
    font-size: 12px;
  }
  .diff-file-head .diff-path { color: var(--fg); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .diff-count { font-size: 11px; font-weight: 600; flex: none; }
  .diff-count.add { color: var(--add-fg); }
  .diff-count.del { color: var(--del-fg); }
  .diff-rows { overflow-x: auto; padding: 4px 0; }
  .diff-row { display: flex; white-space: pre; line-height: 1.5; }
  .diff-row .gut {
    flex: none;
    display: flex;
    width: 76px;
    padding: 0 8px 0 0;
    color: var(--muted);
    opacity: 0.65;
    user-select: none;
    text-align: right;
  }
  .diff-row .gut span { width: 34px; display: inline-block; }
  .diff-row .line-content { flex: 1; padding-right: 12px; }
  .diff-row.add { background: var(--add-bg); }
  .diff-row.add .line-content { color: var(--add-fg); }
  .diff-row.del { background: var(--del-bg); }
  .diff-row.del .line-content { color: var(--del-fg); }
  .diff-row.hunk .line-content { color: var(--accent); }
  .diff-toggle {
    margin: 8px 0 0;
    padding: 4px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .diff-toggle:hover { color: var(--fg); border-color: var(--accent); }

  .pick-bar { display: flex; gap: 8px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
  .pick-bar button {
    padding: 6px 18px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--fg);
    font: inherit;
    font-weight: 500;
    cursor: pointer;
  }
  .pick-bar button:hover { border-color: var(--accent); color: var(--accent); }
  .pick-bar button.pick-main { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .pick-bar button.pick-main:hover { filter: brightness(1.1); color: var(--on-accent); }

  .done-note { margin-top: 20px; font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><span class="wordmark">modes</span><span class="tag">console</span></div>
    <button type="button" id="new-task-btn">+ New task</button>
    <div class="task-list" id="task-list"></div>
  </aside>
  <main>
    <section id="stage-empty">
      <div class="empty-inner">
        <h1 class="empty-title">今天让团队做点什么？</h1>
        <div class="roster">
          <span class="roster-label" id="roster-label">团队：自动搭配</span>
          <div class="cli-chips" id="cli-chips"></div>
        </div>
        <div class="mode-links">
          <button type="button" id="mode-auto" class="active">统筹(自动)</button><span class="sep"> · </span><button type="button" id="mode-single">单人</button><span class="sep"> · </span><button type="button" id="mode-compete">竞赛</button><span class="sep"> · </span><button type="button" id="mode-brainstorm">脑暴</button><span class="sep"> · </span><button type="button" id="mode-cascade">接力</button><span class="sep"> · </span><button type="button" id="mode-roundtable">圆桌</button>
        </div>
        <form id="run-form">
          <div class="ask-card">
            <textarea id="prompt" placeholder="给团队派个任务…" required></textarea>
            <div class="ask-bar">
              <button class="primary" id="run-btn" type="submit" title="派出任务" aria-label="派出任务"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M8 3L3.5 7.5M8 3l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
          </div>
          <div class="repo-wrap" id="repo-wrap">
            <button type="button" class="repo-chip" id="repo-chip" aria-expanded="false"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M1.5 3.5a1 1 0 0 1 1-1h3l1.5 2h6.5a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-9Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>在项目中工作</button>
            <div class="repo-row" id="repo-row" hidden>
              <input type="text" id="repo-path" placeholder="项目路径（必须是 git 仓库）；留空 = console 当前目录" />
            </div>
          </div>
        </form>
        <div class="suggestions">
          <span class="sugg-label">试试这些指令</span>
          <button type="button" class="suggestion">给我解释一下这个项目是做什么的，从哪里入手</button>
          <button type="button" class="suggestion">找出这个仓库里最值得重构的三个地方，给出理由</button>
          <button type="button" class="suggestion">为这个项目的 README 写一段更有吸引力的开头</button>
        </div>
      </div>
    </section>
    <section id="detail" hidden></section>
  </main>
</div>

<script>
"use strict";

// API base: standalone, the console server serves this file at / and the API
// at /api/*. Embedded in AionUi as the modes-console extension, an injected
// window.MODES_API_BASE points at the console server directly (absolute URL —
// aioncore 2.2.2 does not mount extension webui apiRoutes, so the panel talks
// to 127.0.0.1:4177 cross-origin; the console's open CORS + bearer token make
// that safe). window.MODES_TOKEN carries the shared token; both are injected
// by whoever serves the HTML (consoleServer GET /, or the extension's
// activate.js asset sync). Embedded URLs carry the task id as ?id= / a body
// field only when routed through the extension's (currently unmounted) proxy
// routes; direct absolute-base mode uses the console's native REST shapes.
const API_BASE = typeof window.MODES_API_BASE === "string" ? window.MODES_API_BASE : "/api";
const TOKEN = typeof window.MODES_TOKEN === "string" ? window.MODES_TOKEN : null;
const VIA_EXTENSION_PROXY = API_BASE === "/modes-console/api";
const apiUrl = {
  tasks: () => `${API_BASE}/tasks`,
  // no /clis route on the extension proxy — the chips fall back to a static list there
  clis: () => `${API_BASE}/clis`,
  task: (id) =>
    VIA_EXTENSION_PROXY ? `${API_BASE}/task?id=${encodeURIComponent(id)}` : `${API_BASE}/tasks/${encodeURIComponent(id)}`,
  pick: (id) =>
    VIA_EXTENSION_PROXY ? `${API_BASE}/pick` : `${API_BASE}/tasks/${encodeURIComponent(id)}/pick`,
  worktrees: (id) => `${API_BASE}/tasks/${encodeURIComponent(id)}/worktrees`,
  // catch-up read of a lane's raw output stream (byte-offset continuation);
  // not on the extension proxy — pulls there fail quietly and only SSE-less
  // polling remains, same as before streams existed
  laneOutput: (id, lane, offset) =>
    `${API_BASE}/tasks/${encodeURIComponent(id)}/lanes/${encodeURIComponent(lane)}/output?offset=${offset}`,
  // EventSource cannot send headers, so the shared token rides as ?token= (the
  // server honors it on this route only). No events route exists on the
  // extension proxy — SSE is skipped there and polling is used.
  events: (id) =>
    `${API_BASE}/tasks/${encodeURIComponent(id)}/events${TOKEN ? `?token=${encodeURIComponent(TOKEN)}` : ""}`,
};

const TERMINAL_STATUSES = new Set(["awaiting_pick", "done", "failed"]);

// CLI chips: the core interaction — 点亮几个 CLI = 雇几个员工协作. The list
// comes from GET /api/clis (server probes PATH); unavailable CLIs render grey.
// Nothing lit by default: an empty selection means "团队：自动搭配" — the
// dispatcher picks the team (no clis field is sent, same as before).
const FALLBACK_CLIS = ["kimi", "qwen", "iflow", "claude", "codex"].map((name) => ({ name, available: true }));

const state = {
  mode: "auto",
  selectedId: null,
  pollTimer: null,
  eventSource: null,
  lastTask: null,
  // [{name, available}] from /api/clis; selected = the lit chips
  clis: [],
  selectedClis: new Set(),
  // diff fold state survives re-renders: key = "<taskId>:<lane|winner>"
  expandedDiffs: new Set(),
  // live lane output for the selected task: { taskId, lanes: Map<lane, entry> }
  // entry = { text, offset, follow, scrollTop, pulling, dirty }; null when no
  // task is selected. text survives re-renders, DOM nodes are repainted from it.
  live: null,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
}[c]));

async function api(pathname, options = {}) {
  const headers = { ...(options.headers || {}) };
  if (TOKEN) headers["x-modes-token"] = TOKEN;
  const res = await fetch(pathname, { ...options, headers });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || res.statusText), { status: res.status, body });
  return body;
}

function statusBadge(status) {
  const cls = status === "done" ? "ok" : status === "failed" ? "bad" : status === "awaiting_pick" ? "warn" : "";
  return `<span class="badge ${cls}">${esc(status.replace("_", " "))}</span>`;
}

// auto-routed tasks show the resolved mode with an "auto" corner badge
function modeBadge(task) {
  const auto = task.classification ? `<span class="badge auto">auto</span>` : "";
  return `<span class="badge mode">${esc(task.mode)}</span>${auto}`;
}

function relativeTime(iso) {
  const seconds = Math.max(0, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (seconds < 45) return "just now";
  const minutes = Math.floor(seconds / 60);
  if (minutes < 60) return `${minutes}m ago`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours}h ago`;
  return `${Math.floor(hours / 24)}d ago`;
}

// --- diff rendering -------------------------------------------------------
// GitHub-style: split a (possibly multi-file) unified diff on `diff --git`
// into per-file blocks — each with a path header and +/- counters — and
// render rows with old/new line-number gutters tracked from hunk headers.
// The logic stays deliberately trivial (prefix classification only, no diff
// grammar) and inline, because the panel is a single buildless file.

const DIFF_FOLD_LINES = 200;

function diffLineClass(line) {
  if (line.startsWith("@@")) return "hunk";
  if (line.startsWith("+++") || line.startsWith("---")) return "";
  if (line.startsWith("+")) return "add";
  if (line.startsWith("-")) return "del";
  return "";
}

function groupDiffFiles(lines) {
  const files = [];
  let current = null;
  for (const line of lines) {
    const m = /^diff --git a\/(.+) b\/(.+)$/.exec(line);
    if (m) {
      current = { path: m[2], lines: [] };
      files.push(current);
      continue;
    }
    if (!current) {
      current = { path: null, lines: [] };
      files.push(current);
    }
    current.lines.push(line);
  }
  return files;
}

function renderDiffFile(file) {
  let adds = 0, dels = 0;
  let oldNo = null, newNo = null;
  const rows = file.lines.map((line) => {
    const cls = diffLineClass(line);
    if (cls === "add") adds++;
    if (cls === "del") dels++;
    let gOld = "", gNew = "";
    if (cls === "hunk") {
      const h = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(line);
      if (h) { oldNo = parseInt(h[1], 10); newNo = parseInt(h[2], 10); }
    } else if (oldNo !== null && !line.startsWith("+++") && !line.startsWith("---")) {
      if (cls === "add") { gNew = newNo++; }
      else if (cls === "del") { gOld = oldNo++; }
      else { gOld = oldNo++; gNew = newNo++; }
    }
    return `<span class="diff-row ${cls}"><span class="gut"><span>${gOld}</span><span>${gNew}</span></span>` +
      `<span class="line-content">${esc(line) || " "}</span></span>`;
  }).join("\n");
  const counts = adds || dels
    ? `<span class="diff-count add">+${adds}</span><span class="diff-count del">−${dels}</span>` : "";
  return `<div class="diff-file">
    <div class="diff-file-head"><span class="diff-path">${esc(file.path || "changes")}</span>${counts}</div>
    <div class="diff-rows">${rows}</div>
  </div>`;
}

function renderDiff(diff, key) {
  const lines = diff.split("\n");
  const expanded = state.expandedDiffs.has(key);
  const folded = !expanded && lines.length > DIFF_FOLD_LINES;
  const shown = folded ? lines.slice(0, DIFF_FOLD_LINES) : lines;
  const html = `<div class="diff">` + groupDiffFiles(shown).map(renderDiffFile).join("") + `</div>`;
  if (lines.length <= DIFF_FOLD_LINES) return html;
  const label = expanded ? "show less" : `show more (${lines.length - DIFF_FOLD_LINES} more lines)`;
  return html + `<button class="diff-toggle" data-diff-key="${esc(key)}">${label}</button>`;
}

function outcomeBadge(outcome) {
  return `<span class="badge ${outcome === "success" ? "ok" : "bad"}">${esc(outcome)}</span>`;
}

// --- live lane output -------------------------------------------------------
// The stream file is the single source of truth: SSE lane_output events are
// appended directly (ordered, batch-flushed before close), and the catch-up
// route covers every gap — first contact mid-stream, a reconnect, a reopened
// running task, or replaying a finished one. CLI output is untrusted text:
// it only ever enters the DOM via textContent, never innerHTML.

const LIVE_MAX_LINES = 2000; // per-lane DOM cap — keep the tail
const LIVE_TRIM_AT = 2400;
const LIVE_TRIM_CHARS = 200000; // only count lines once the text is big
const utf8 = new TextEncoder();
const byteLen = (s) => utf8.encode(s).length;

// lane output sits inside an existing terminal panel (under its head)…
function liveWrap(lane) {
  return `<div class="live-wrap" data-live-wrap="${esc(lane)}" hidden>` +
    `<div class="live-out" data-lane="${esc(lane)}"></div>` +
    `<button type="button" class="back-bottom" data-lane="${esc(lane)}" hidden>回到底部</button></div>`;
}

// …or, for lanes with no panel of their own (review / synthesis / consensus /
// cascade attempts), as a standalone terminal panel
function livePanel(lane, running = false) {
  const dot = running ? `<span class="dot st-running"></span>` : "";
  return `<div class="term live-panel" data-live-panel="${esc(lane)}"${running ? "" : " hidden"}>` +
    `<div class="term-head"><span class="term-name">${esc(lane)}</span>${dot}</div>${liveWrap(lane)}</div>`;
}

// a lane label can map to several panels (roundtable repeats cli panels per
// round — both rounds stream under the same label), so paint them all
function laneDetailEls(selector, lane) {
  return [...$("detail").querySelectorAll(`${selector}[data-lane="${CSS.escape(lane)}"]`)];
}
const laneOutEls = (lane) => laneDetailEls(".live-out", lane);
const laneWrapEls = (lane) => [...$("detail").querySelectorAll(`[data-live-wrap="${CSS.escape(lane)}"]`)];
const lanePanelEls = (lane) => [...$("detail").querySelectorAll(`[data-live-panel="${CSS.escape(lane)}"]`)];

function liveEntry(lane) {
  const live = state.live;
  if (!live) return null;
  let e = live.lanes.get(lane);
  if (!e) {
    e = { text: "", offset: 0, follow: true, scrollTop: 0, pulling: false, dirty: false };
    live.lanes.set(lane, e);
  }
  return e;
}

function revealLane(lane) {
  for (const el of laneWrapEls(lane)) el.hidden = false;
  for (const el of lanePanelEls(lane)) el.hidden = false;
}

function paintLane(lane) {
  const e = state.live?.lanes.get(lane);
  if (!e) return;
  const outs = laneOutEls(lane);
  if (!outs.length) return;
  const btns = laneDetailEls(".back-bottom", lane);
  if (e.text) revealLane(lane);
  for (const out of outs) {
    out.textContent = e.text;
    if (e.follow) out.scrollTop = out.scrollHeight;
    else out.scrollTop = e.scrollTop;
  }
  for (const btn of btns) btn.hidden = e.follow;
}

function trimLiveText(e) {
  if (e.text.length < LIVE_TRIM_CHARS) return;
  const lines = e.text.split("\n");
  if (lines.length > LIVE_TRIM_AT) e.text = lines.slice(-LIVE_MAX_LINES).join("\n");
}

// a lane first announces itself via its first stream chunk, mid-render cycle —
// rebuild the running view so its panel appears now, not at the next status push
function ensureLaneVisible() {
  if (state.lastTask?.status === "running") renderDetail(state.lastTask);
}

function appendLaneText(lane, chunk) {
  const e = liveEntry(lane);
  if (!e) return;
  const before = e.text.length;
  e.text += chunk;
  trimLiveText(e);
  const outs = laneOutEls(lane);
  if (!outs.length) { ensureLaneVisible(); return; }
  revealLane(lane);
  for (const out of outs) {
    out.textContent += chunk; // untrusted CLI output: textContent only, never innerHTML
    if (e.text.length !== before + chunk.length) out.textContent = e.text; // a trim landed
    if (e.follow) out.scrollTop = out.scrollHeight;
  }
}

// offset-continuation read; serialized per lane, re-armed when a read was
// requested while one was in flight. Failures (no stream yet, older server,
// extension proxy) stay silent — the lane simply has no output area.
async function pullLane(id, lane) {
  const live = state.live;
  if (!live || live.taskId !== id) return;
  const e = liveEntry(lane);
  if (!e) return;
  if (e.pulling) { e.dirty = true; return; }
  e.pulling = true;
  try {
    const r = await api(apiUrl.laneOutput(id, lane, e.offset));
    if (state.live !== live) return;
    if (e.offset === 0 || r.truncated) {
      // authoritative replace: first catch-up, or the capped file rewrote to its tail
      e.text = r.content;
      trimLiveText(e);
      paintLane(lane);
      if (!laneOutEls(lane).length) ensureLaneVisible();
    } else if (r.content) {
      appendLaneText(lane, r.content);
    }
    e.offset = r.offset;
  } catch {
    /* no stream (yet) — the lane stays quiet */
  } finally {
    e.pulling = false;
    if (e.dirty) {
      e.dirty = false;
      if (state.live === live) pullLane(id, lane);
    }
  }
}

function resyncLanes(id) {
  const live = state.live;
  if (!live || live.taskId !== id) return;
  for (const lane of live.lanes.keys()) pullLane(id, lane);
}

// lane labels derivable from a finished task's JSON — for replay pulls
function streamLanesFor(task) {
  const lanes = [];
  if (task.mode === "compete") {
    for (const l of task.lanes || []) lanes.push(l.lane);
    if (task.review) lanes.push("review");
  } else if (task.mode === "single") {
    lanes.push("single");
  } else if (task.mode === "cascade") {
    for (const a of task.attempts || []) lanes.push(`cascade-${a.level}`);
  } else if (task.mode === "brainstorm") {
    for (const l of task.lanes || []) lanes.push(l.lane);
    if (task.synthesis) lanes.push("synthesis");
  } else if (task.mode === "roundtable") {
    const clis = new Set();
    for (const r of task.rounds || []) for (const l of r.lanes || []) clis.add(l.cli);
    lanes.push(...clis);
    const rounds = task.rounds || [];
    for (let i = 1; i < rounds.length; i++) lanes.push(`consensus-r${i}`);
    if (task.consensus && rounds.length) lanes.push(`consensus-r${rounds.length}`);
    if (task.synthesis) lanes.push("synthesis");
  }
  return lanes;
}


// --- stage switching --------------------------------------------------------
// The stage is either the dispatch empty state or the selected task's view.
// "+ New task" and task selection flip between the two.

function showStage(which) {
  $("stage-empty").hidden = which !== "empty";
  $("detail").hidden = which !== "detail";
}

function showEmpty() {
  state.selectedId = null;
  state.lastTask = null;
  state.live = null;
  stopFollowing();
  showStage("empty");
  refreshTaskList();
}

// --- CLI chips ------------------------------------------------------------

function renderCliChips() {
  const box = $("cli-chips");
  // none lit = the dispatcher assembles the team; lit chips = hand-picked
  $("roster-label").textContent = state.selectedClis.size
    ? `团队：${[...state.selectedClis].join(" · ")}`
    : "团队：自动搭配";
  if (!state.clis.length) { box.innerHTML = ""; return; }
  box.innerHTML = state.clis.map((c) => {
    const on = state.selectedClis.has(c.name);
    const disabled = c.available ? "" : "disabled";
    const title = c.available ? (on ? "已点亮 — 点击撤下" : "点击点亮，加入团队") : "未安装 / 不可用";
    return `<button type="button" class="cli-chip ${on ? "on" : ""}" data-cli="${esc(c.name)}" ${disabled} title="${esc(title)}">` +
      `<span class="chip-dot ${c.available ? "ok" : "off"}"></span>${esc(c.name)}</button>`;
  }).join("");
  for (const el of box.querySelectorAll(".cli-chip:not([disabled])")) {
    el.addEventListener("click", () => {
      const name = el.dataset.cli;
      if (state.selectedClis.has(name)) state.selectedClis.delete(name);
      else state.selectedClis.add(name);
      renderCliChips();
    });
  }
}

async function loadClis() {
  try {
    state.clis = await api(apiUrl.clis());
  } catch {
    state.clis = FALLBACK_CLIS; // older server or the extension proxy: no probe route
  }
  renderCliChips();
}

// --- sidebar: Orca-style workspaces grouped by status ----------------------

const TASK_GROUPS = [
  ["In progress", (t) => t.status === "running"],
  ["Needs review", (t) => t.status === "awaiting_pick"],
  ["Done", (t) => t.status === "done" || t.status === "failed"],
];

function repoShort(repoPath) {
  if (!repoPath) return "local";
  const parts = repoPath.replace(/\/+$/, "").split("/");
  return parts[parts.length - 1] || "local";
}

function renderTaskItem(t) {
  return `
    <div class="task-item ${t.id === state.selectedId ? "selected" : ""}" data-id="${esc(t.id)}">
      <div class="ti-top">
        <span class="repo-badge">${esc(repoShort(t.repoPath))}</span>
        <span class="prompt">${esc(t.prompt)}</span>
      </div>
      <div class="meta">
        <span class="dot st-${esc(t.status)}"></span>
        <span class="ti-mode">${esc(t.mode)}${t.classification ? ` <span class="auto-mark">· auto</span>` : ""}</span>
        ${t.status !== "running" ? `<button type="button" class="ti-clean" data-id="${esc(t.id)}" title="清理该任务的 worktree 和分支（不动任务记录）">清理</button>` : ""}
        <span class="ti-time">${esc(relativeTime(t.createdAt))}</span>
      </div>
    </div>`;
}

async function cleanWorktrees(id, btn) {
  btn.disabled = true;
  try {
    const res = await api(apiUrl.worktrees(id), { method: "DELETE" });
    const failed = res.failed?.length ? `，失败 ${res.failed.length} 项` : "";
    btn.textContent = `已清 ${res.removed.length}${failed}`;
    btn.title = res.failed?.map((f) => `${f.target}: ${f.error}`).join("\n") || "worktree 已清理";
  } catch (err) {
    btn.textContent = "清理失败";
    btn.title = err.message;
    btn.disabled = false;
  }
}

async function refreshTaskList() {
  const tasks = await api(apiUrl.tasks());
  const box = $("task-list");
  if (!tasks.length) {
    box.innerHTML = `<div class="tl-empty">No tasks yet — dispatch one from the stage.</div>`;
    return;
  }
  let html = "";
  for (const [label, match] of TASK_GROUPS) {
    const group = tasks.filter(match);
    if (!group.length) continue;
    html += `<div class="tl-group-head">${esc(label)} <span class="count">(${group.length})</span></div>`;
    html += group.map(renderTaskItem).join("");
  }
  box.innerHTML = html;
  for (const el of document.querySelectorAll(".task-item")) {
    el.addEventListener("click", () => selectTask(el.dataset.id));
  }
  for (const el of document.querySelectorAll(".ti-clean")) {
    el.addEventListener("click", (e) => {
      e.stopPropagation(); // don't select the task when cleaning it
      cleanWorktrees(el.dataset.id, el);
    });
  }
}

function stopPolling() {
  if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
}

function stopEventStream() {
  if (state.eventSource) { state.eventSource.close(); state.eventSource = null; }
}

function stopFollowing() {
  stopPolling();
  stopEventStream();
}

// Follow a running task: SSE push first, 2s polling as fallback (EventSource
// unavailable, the extension proxy base, or a stream error — e.g. an older
// console server without the events route).
function followTask(id) {
  stopFollowing();
  if (typeof EventSource === "undefined" || VIA_EXTENSION_PROXY) return startPolling();
  const es = new EventSource(apiUrl.events(id));
  state.eventSource = es;
  es.onmessage = (e) => {
    const task = JSON.parse(e.data);
    if (task.id !== state.selectedId) return;
    renderDetail(task);
    refreshTaskList();
    // close before the server's own close lands, so EventSource never retries;
    // then pull every lane the finished JSON names — lanes whose whole stream
    // pre-dated our subscription were never announced over SSE at all
    if (TERMINAL_STATUSES.has(task.status)) {
      stopEventStream();
      for (const lane of streamLanesFor(task)) pullLane(id, lane);
      resyncLanes(id);
    }
  };
  es.addEventListener("lane_output", (e) => {
    const { lane, chunk } = JSON.parse(e.data);
    const live = state.live;
    if (!live || live.taskId !== id) return;
    const entry = live.lanes.get(lane);
    // first contact (e.g. a reopened running task): catch up from offset 0 so
    // the lane shows its whole story, not a tail starting mid-sentence
    if (!entry) { pullLane(id, lane); return; }
    if (entry.pulling) return; // the in-flight read already covers this chunk
    appendLaneText(lane, chunk);
    entry.offset += byteLen(chunk);
  });
  es.onerror = () => {
    if (state.eventSource !== es) return; // we closed it ourselves
    // CLOSED = the stream is gone for good (older server, proxy) → polling.
    // CONNECTING = EventSource is auto-reconnecting; either way the catch-up
    // reads cover whatever the gap dropped.
    if (es.readyState === EventSource.CLOSED) {
      stopEventStream();
      startPolling();
    }
    resyncLanes(id);
  };
}

function startPolling() {
  stopPolling();
  state.pollTimer = setInterval(async () => {
    if (!state.selectedId) return stopPolling();
    const task = await api(apiUrl.task(state.selectedId));
    renderDetail(task);
    refreshTaskList();
    // lanes already discovered keep streaming under polling; new lanes mid-run
    // are only announced over SSE, which this path has no access to
    if (!VIA_EXTENSION_PROXY) resyncLanes(state.selectedId);
    if (task.status !== "running") {
      for (const lane of streamLanesFor(task)) pullLane(task.id, lane);
      stopPolling();
    }
  }, 2000);
}

async function selectTask(id) {
  state.selectedId = id;
  state.live = { taskId: id, lanes: new Map() };
  const task = await api(apiUrl.task(id));
  renderDetail(task);
  refreshTaskList();
  if (task.status === "running") {
    followTask(id); // lanes are discovered as their first chunks arrive
  } else {
    stopFollowing();
    // replay: finished tasks keep their stream files — pull every lane's once
    for (const lane of streamLanesFor(task)) pullLane(id, lane);
  }
}

function renderDetail(task) {
  state.lastTask = task;
  showStage("detail");
  const detail = $("detail");
  const classificationBanner = task.classification
    ? (() => {
        // who made the call: the AI dispatcher, or the rule router as its fallback
        const source = task.classification.dispatchSource === "ai" ? "AI dispatch"
          : task.classification.dispatchSource === "rules-fallback" ? "rules fallback"
          : task.classification.confidence ? `${task.classification.confidence} confidence` : "";
        return `<div class="banner classification">
          <span class="banner-label">dispatcher</span>
          <div><span class="verdict">auto → ${esc(task.classification.mode)}</span>${source ? `<span class="source-tag">${esc(source)}</span>` : ""}</div>
          <div class="muted">${esc(task.classification.reason)}</div>
        </div>`;
      })()
    : "";
  let html = `
    <div class="task-bar">
      <span class="tb-title">${esc(task.prompt)}</span>
      ${modeBadge(task)} ${statusBadge(task.status)}
    </div>
    <div class="task-body">
      <div class="meta">
        <span class="muted mono">${esc(task.repoPath)}</span>
        <span class="muted">${esc(relativeTime(task.createdAt))}</span>
        <span class="muted mono">${esc(task.id.slice(0, 8))}</span>
      </div>
      ${classificationBanner}
      ${task.error ? `<div class="error-box">${esc(task.error)}</div>` : ""}`;

  let body = "";
  if (task.status === "running") {
    // lanes announce themselves via their first stream chunk; panels appear in
    // arrival order and repaint from state.live on every re-render
    const liveLanes = [...(state.live?.lanes.keys() ?? [])]
      .map((lane) => livePanel(lane, true))
      .join("");
    body = `<div class="running-note"><span class="dot st-running"></span>running — the team is on it…</div>` +
      `<div class="lanes single" id="live-lanes">${liveLanes}</div>`;
  } else if (task.mode === "compete") {
    body = renderCompete(task);
  } else if (task.mode === "cascade") {
    body = renderCascade(task);
  } else if (task.mode === "roundtable") {
    body = renderRoundtable(task);
  } else if (task.mode === "single") {
    body = renderSingle(task);
  } else {
    body = renderBrainstorm(task);
  }
  detail.innerHTML = html + body + `</div>`;

  // repaint live output from state (DOM nodes were just rebuilt)
  for (const lane of state.live?.lanes.keys() ?? []) paintLane(lane);

  for (const el of detail.querySelectorAll(".back-bottom")) {
    el.addEventListener("click", () => {
      const entry = state.live?.lanes.get(el.dataset.lane);
      if (!entry) return;
      entry.follow = true;
      for (const out of laneOutEls(el.dataset.lane)) out.scrollTop = out.scrollHeight;
      for (const btn of laneDetailEls(".back-bottom", el.dataset.lane)) btn.hidden = true;
    });
  }

  if (task.status === "awaiting_pick") {
    const picks = task.mode === "cascade"
      ? [`cascade-${task.winner.level}`, "neither"]
      : task.mode === "single"
        ? ["single", "neither"]
        : [...(task.lanes || []).map((l) => l.lane), "neither"];
    for (const pick of picks) {
      $(`pick-${pick}`).addEventListener("click", () => applyPick(task.id, pick));
    }
  }

  for (const el of detail.querySelectorAll(".diff-toggle")) {
    el.addEventListener("click", () => {
      const key = el.dataset.diffKey;
      if (state.expandedDiffs.has(key)) state.expandedDiffs.delete(key);
      else state.expandedDiffs.add(key);
      if (state.lastTask) renderDetail(state.lastTask);
    });
  }
}

function renderCompete(task) {
  let html = "";
  if (task.review) {
    const rec = task.review.pick === "tie" ? "TIE — comparable quality"
      : task.review.pick ? `reviewer recommends lane ${task.review.pick}` : "no recommendation";
    html += `<div class="banner">
      <span class="banner-label">cross-review</span>
      <div><span class="verdict">verdict: ${esc(task.review.verdict)}</span> · ${esc(rec)}</div>
      <div class="muted">${esc(task.review.rationale)}</div>
    </div>` + livePanel("review");
  }
  html += `<div class="lanes">` + (task.lanes || []).map((l) => `
    <div class="term">
      <div class="term-head"><span class="term-name">lane ${esc(String(l.lane).toLowerCase())}</span>${outcomeBadge(l.outcome)}</div>
      ${liveWrap(l.lane)}
      <div class="term-body">${esc(l.summary || "(no summary)")}</div>
      ${l.diff ? renderDiff(l.diff, `${task.id}:lane-${l.lane}`) : `<div class="term-body muted-body">(no changes)</div>`}
    </div>`).join("") + `</div>`;
  if (task.status === "awaiting_pick") {
    const laneButtons = (task.lanes || [])
      .map((l) => `<button class="pick-main" id="pick-${esc(l.lane)}">Pick ${esc(l.lane)}</button>`)
      .join("\n      ");
    html += `<div class="pick-bar">
      ${laneButtons}
      <button id="pick-neither">Neither</button>
      <span class="muted">merges the picked lane into the current branch</span>
    </div>`;
  } else if (task.status === "done") {
    html += `<p class="muted done-note">pick recorded — task done.</p>`;
  }
  return html;
}

function renderCascade(task) {
  let html = `<div class="chain">` + (task.attempts || []).map((a, i) => `
    ${i > 0 ? `<span class="chain-arrow">→</span>` : ""}
    <div class="chain-step">
      <div class="step-head">L${esc(a.level)} · ${esc(a.cli)}</div>
      <div class="step-body">${outcomeBadge(a.outcome)}<span class="step-latency">${(a.latency / 1000).toFixed(1)}s</span></div>
    </div>`).join("") + `</div>`;
  // every attempt level streamed under its own label — replay panels below the chain
  html += (task.attempts || []).map((a) => livePanel(`cascade-${a.level}`)).join("");
  if (task.winner) {
    html += `<div class="lanes single"><div class="term">
      <div class="term-head"><span class="term-name">winner — L${esc(task.winner.level)} (${esc(task.winner.cli)})</span></div>
      <div class="term-body">${esc(task.winner.summary || "(no summary)")}</div>
      ${task.winner.diff ? renderDiff(task.winner.diff, `${task.id}:winner`) : `<div class="term-body muted-body">(no changes)</div>`}
    </div></div>`;
  } else {
    html += `<div class="banner"><span class="verdict">chain exhausted — no output</span>
      <div class="muted">every level failed or produced nothing; there is no winner to merge.</div></div>`;
  }
  if (task.status === "awaiting_pick") {
    html += `<div class="pick-bar">
      <button class="pick-main" id="pick-cascade-${esc(task.winner.level)}">Merge cascade-${esc(task.winner.level)}</button>
      <button id="pick-neither">Neither</button>
      <span class="muted">merges the winning level into the current branch</span>
    </div>`;
  } else if (task.status === "done" && task.winner) {
    html += `<p class="muted done-note">pick recorded — task done.</p>`;
  }
  return html;
}

// single: one shot, one lane — merge only when there is a diff to merge
function renderSingle(task) {
  const l = task.lane;
  if (!l) return `<p class="muted">(no lane result)</p>`;
  let html = `<div class="lanes single">
    <div class="term">
      <div class="term-head"><span class="term-name">${esc(l.cli)}</span>${outcomeBadge(l.outcome)}</div>
      ${liveWrap("single")}
      <div class="term-body">${esc(l.summary || "(no summary)")}</div>
      ${l.diff ? renderDiff(l.diff, `${task.id}:single`) : `<div class="term-body muted-body">(no changes)</div>`}
    </div></div>`;
  if (task.status === "awaiting_pick") {
    html += `<div class="pick-bar">
      <button class="pick-main" id="pick-single">Merge</button>
      <button id="pick-neither">Neither</button>
      <span class="muted">merges the lane's diff into the current branch</span>
    </div>`;
  } else if (task.status === "done" && l.outcome === "success" && l.diff) {
    html += `<p class="muted done-note">pick recorded — task done.</p>`;
  } else if (task.status === "done" && l.outcome !== "success") {
    html += `<div class="banner"><span class="verdict">lane failed — nothing to merge</span>
      <div class="muted">single is one shot: there is no fallback level, the failure is reported as-is.</div></div>`;
  }
  return html;
}

function renderBrainstorm(task) {
  let html = `<div class="lanes single">` + (task.lanes || []).map((l) => `
    <div class="term">
      <div class="term-head"><span class="term-name">lane ${esc(String(l.lane).toLowerCase())}</span>${outcomeBadge(l.outcome)}</div>
      ${liveWrap(l.lane)}
      <div class="term-body">${esc(l.answer || "(no answer)")}</div>
    </div>`).join("") + `</div>`;
  if (task.synthesis) {
    html += `<div class="banner"><span class="banner-label">synthesis</span>
      <div class="muted" style="white-space:pre-wrap">${esc(task.synthesis)}</div></div>` + livePanel("synthesis");
  } else if (task.status === "done") {
    html += `<p class="muted done-note">synthesis skipped — all lanes failed.</p>`;
  }
  return html;
}

// roundtable: rounds of cross-seeing debate — round card groups separated by
// the consensus verdict that decided whether the debate continued
function renderRoundtable(task) {
  const rounds = task.rounds || [];
  let html = "";
  rounds.forEach((r, i) => {
    html += `<div class="round-head">round ${esc(r.round)}</div>`;
    html += `<div class="lanes">` + (r.lanes || []).map((l) => `
      <div class="term">
        <div class="term-head"><span class="term-name">${esc(l.cli)}</span>${outcomeBadge(l.outcome)}</div>
        ${liveWrap(l.cli)}
        <div class="term-body">${esc(l.answer || "(no answer)")}</div>
      </div>`).join("") + `</div>`;
    if (task.consensus && i === rounds.length - 1) {
      html += `<div class="banner"><span class="verdict">consensus reached</span>
        <div class="muted">the reviewer judged the positions substantively identical — the debate stopped early.</div></div>` +
        livePanel(`consensus-r${r.round}`);
    } else if (i < rounds.length - 1) {
      html += `<div class="banner"><span class="verdict">no consensus</span>
        <div class="muted">real differences remained — the table continued into round ${esc(rounds[i + 1].round)}.</div></div>` +
        livePanel(`consensus-r${r.round}`);
    }
  });
  if (task.synthesis) {
    html += `<div class="banner"><span class="banner-label">synthesis</span>
      <div class="muted" style="white-space:pre-wrap">${esc(task.synthesis)}</div></div>` + livePanel("synthesis");
  } else if (task.status === "done") {
    html += `<p class="muted done-note">synthesis skipped — all lanes failed.</p>`;
  }
  return html;
}

async function applyPick(id, pick) {
  stopFollowing(); // the pick resolves the task; no more progress to follow
  try {
    const task = await api(apiUrl.pick(id), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(VIA_EXTENSION_PROXY ? { id, pick } : { pick }),
    });
    renderDetail(task);
    refreshTaskList();
  } catch (err) {
    const task = await api(apiUrl.task(id));
    renderDetail(task);
    alert(`Pick failed: ${err.message}`);
  }
}

function setMode(mode) {
  state.mode = mode;
  for (const m of ["auto", "single", "compete", "brainstorm", "cascade", "roundtable"]) {
    $(`mode-${m}`).classList.toggle("active", mode === m);
  }
  // brainstorm and roundtable need no git repo (thinking, not commits); compete,
  // cascade and single run in worktrees of one; auto may route anywhere, so keep
  // the chip (ignored on the thinking modes)
  $("repo-wrap").style.display = mode === "brainstorm" || mode === "roundtable" ? "none" : "";
}

for (const m of ["auto", "single", "compete", "brainstorm", "cascade", "roundtable"]) {
  $(`mode-${m}`).addEventListener("click", () => setMode(m));
}

$("new-task-btn").addEventListener("click", showEmpty);

// "在项目中工作": collapsed by default — a hidden path means the console's cwd
$("repo-chip").addEventListener("click", () => {
  const row = $("repo-row");
  const open = row.hidden;
  row.hidden = !open;
  $("repo-chip").classList.toggle("open", open);
  $("repo-chip").setAttribute("aria-expanded", String(open));
  if (open) $("repo-path").focus();
});

// starter prompts fill the ask box, they never dispatch on their own
for (const el of document.querySelectorAll(".suggestion")) {
  el.addEventListener("click", () => {
    $("prompt").value = el.textContent;
    $("prompt").focus();
  });
}

$("run-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const prompt = $("prompt").value.trim();
  if (!prompt) return;
  const repoPath = $("repo-path").value.trim();
  // the panel only sends the lit chips; the server maps clis onto each mode's
  // engine shape (lane letters for compete/brainstorm, chain order for cascade)
  const clis = [...state.selectedClis];
  $("run-btn").disabled = true;
  try {
    const { id } = await api(apiUrl.tasks(), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        mode: state.mode,
        prompt,
        ...(clis.length ? { clis } : {}),
        ...(repoPath ? { repoPath } : {}),
      }),
    });
    $("prompt").value = "";
    await refreshTaskList();
    await selectTask(id);
  } catch (err) {
    alert(`Run failed: ${err.message}`);
  } finally {
    $("run-btn").disabled = false;
  }
});

// live output scroll: capture-phase so it survives innerHTML rebuilds of
// #detail; scrolling up pauses auto-follow and offers a way back to the tail
$("detail").addEventListener("scroll", (e) => {
  const out = e.target;
  if (!(out instanceof Element) || !out.classList.contains("live-out")) return;
  const entry = state.live?.lanes.get(out.dataset.lane);
  if (!entry) return;
  entry.scrollTop = out.scrollTop;
  entry.follow = out.scrollTop + out.clientHeight >= out.scrollHeight - 24;
  for (const btn of laneDetailEls(".back-bottom", out.dataset.lane)) btn.hidden = entry.follow;
}, true);

setMode("auto");
loadClis();
refreshTaskList();
</script>
</body>
</html>
